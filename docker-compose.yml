services:
  dev_postgres:
    image: postgres:16-alpine
    container_name: dev-postgres
    restart: always
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test_postgres:
    image: postgres:16-alpine
    container_name: test-postgres
    env_file:
      - .env.test
    ports:
      - "5433:5432"

  dev_app:
    profiles: ["dev_app"]
    build: .
    container_name: dev-fastapi-app
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - APP_ENV=dev
      - POSTGRES_SERVER: dev-postgres
    depends_on:
      dev_postgres:
        condition: service_started

volumes:
  postgres_data: